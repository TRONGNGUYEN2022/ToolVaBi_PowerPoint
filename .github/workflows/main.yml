name: Build ToolVaBi PowerPoint VSTO Add-in

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on Microsoft Cloud (VS 2022)
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore and Build VSTO Add-in
      run: |
        msbuild ToolVaBiPPT.csproj /t:Restore,Build /p:Configuration=Release /p:Platform="Any CPU" /p:OutputPath=bin\Release\ /p:AssemblySearchPaths="C:\Program Files\Common Files\microsoft shared\VSTO\10.0\;C:\Program Files (x86)\Common Files\microsoft shared\VSTO\10.0\;{CandidateAssemblyFiles};{HintPathFromItem};{TargetFrameworkDirectory}"

    - name: Package Compiled Files
      run: |
        powershell Compress-Archive -Path bin\Release\* -DestinationPath ToolVaBi_PowerPoint_Compiled.zip -Force

    - name: Upload Downloadable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ToolVaBi_PowerPoint_Compiled_Binary
        path: ToolVaBi_PowerPoint_Compiled.zip
        retention-days: 30
