name: Build ToolVaBi PowerPoint VSTO Add-in

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on Microsoft Cloud
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Compile ToolVaBiPPT.dll
      run: dotnet build ToolVaBiPPT.csproj -c Release -o bin/Release

    - name: Package Release Artifact
      run: |
        powershell Compress-Archive -Path bin/Release/* -DestinationPath ToolVaBi_PowerPoint_Compiled.zip -Force

    - name: Upload Downloadable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ToolVaBi_PowerPoint_Compiled_Binary
        path: ToolVaBi_PowerPoint_Compiled.zip
        retention-days: 30
